# Builds raf-extension.zip and attaches it to the GitHub release of the tag.
# Runs on every pushed v* tag. For an existing release: Actions → "Release zip" → Run workflow → tag.
name: Release zip

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the tag
        id: t
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.t.outputs.tag }}
          fetch-depth: 0

      - name: Use the latest packaging script
        run: git checkout "origin/${{ github.event.repository.default_branch }}" -- scripts/build-release.sh

      - name: Build raf-extension.zip
        run: ./scripts/build-release.sh

      - name: Check the version matches the tag
        run: |
          v=$(python3 -c "import json;print(json.load(open('dist/raf-extension/manifest.json'))['version'])")
          [ "v$v" = "${{ steps.t.outputs.tag }}" ] || { echo "manifest is $v but tag is ${{ steps.t.outputs.tag }}"; exit 1; }

      - name: Attach to the release (create it if it doesn't exist)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.t.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            notes="dist/RELEASE-$TAG.md"; [ -f "$notes" ] || notes=/dev/null
            gh release create "$TAG" --title "Raf ${TAG#v}" --notes-file "$notes"
          fi
          gh release upload "$TAG" dist/raf-extension.zip --clobber
