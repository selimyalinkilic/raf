<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Raf</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="options.css"><link rel="stylesheet" href="skins.css"><script src="iconpaint.js"></script><script src="theme.js"></script></head>
<body class="options">
  <header><img src="icons/icon.svg" alt=""><span data-t="optTitle" data-t-title="optTitle"></span><em id="flash"></em></header>
  <main>
    <section class="card">
      <h2><i data-i="globe"></i> <span data-t="optLanguage"></span></h2>
      <p class="hint"><span data-t="optLanguageHint"></span></p>
      <div class="langs" id="langs">
        <label><input type="radio" name="lang" value="auto"><span data-t="langAuto"></span></label>
        <label><input type="radio" name="lang" value="en"><span>English</span></label>
        <label><input type="radio" name="lang" value="tr"><span>Türkçe</span></label>
      </div>
    </section>
    <section class="card">
      <h2><i data-i="moon"></i> <span data-t="optTheme"></span></h2>
      <div class="skins" id="skins"></div>
      <p class="hint" id="mode-hint"><span data-t="optThemeHint"></span></p>
      <div class="langs" id="themes">
        <label><input type="radio" name="theme" value="auto"><i data-i="monitor"></i><span data-t="themeAuto"></span></label>
        <label><input type="radio" name="theme" value="light"><i data-i="sun"></i><span data-t="themeLight"></span></label>
        <label><input type="radio" name="theme" value="dark"><i data-i="moon"></i><span data-t="themeDark"></span></label>
      </div>
    </section>
    <section class="card" id="telegram">
      <h2><i data-i="send"></i> <span data-t="tgTitle"></span></h2>
      <p class="hint"><span data-t="tgIntro"></span></p>
      <div id="tg-off">
        <div id="tg-hub" hidden>
          <button id="tg-hub-connect" class="btn main wide"><i data-i="send"></i> <span data-t="tgHubConnect"></span></button>
          <p class="hint" data-t="tgHubHint"></p>
          <p id="tg-hub-msg" class="hint"></p>
        </div>
        <details id="tg-own" class="tgown"><summary data-t="tgOwnBot"></summary>
        <ol class="steps">
          <li data-t-html="tgStep1"></li>
          <li><span data-t-html="tgStep2"></span>
            <div class="tgrow"><input id="tg-token" type="password" autocomplete="off" placeholder="123456789:AA…"><button id="tg-connect" class="btn"><i data-i="link"></i> <span data-t="tgConnect"></span></button></div></li>
          <li><span data-t-html="tgStep3"></span> <a id="tg-open" class="mini tglink" target="_blank" hidden></a></li>
        </ol>
        <p id="tg-msg" class="hint"></p>
        </details>
      </div>
      <div id="tg-on" hidden>
        <p class="mode" id="tg-status"></p>
        <label class="chk"><input type="checkbox" id="tg-auto"> <span data-t="tgAuto"></span></label>
        <label class="chk"><input type="checkbox" id="tg-listen"> <span data-t="tgListen"></span></label>
        <p class="hint" data-t-html="tgCommands"></p>
        <div class="row"><button id="tg-test" class="mini"><i data-i="send"></i> <span data-t="tgTest"></span></button><button id="tg-disconnect" class="mini"><i data-i="x"></i> <span data-t="tgDisconnect"></span></button></div>
        <p id="tg-msg2" class="hint"></p>
      </div>
    </section>
    <section class="card" id="mail">
      <h2><i data-i="mail"></i> <span data-t="mailTitle"></span></h2>
      <p class="hint"><span data-t="mailIntro"></span></p>
      <label><span data-t="mailTo"></span><input id="mail-to" type="email" placeholder="you@example.com" autocomplete="email"></label>
      <div class="langs" id="mail-via">
        <label><input type="radio" name="via" value="default"><span data-t="mailDefault"></span></label>
        <label><input type="radio" name="via" value="gmail"><span>Gmail</span></label>
        <label><input type="radio" name="via" value="outlook"><span>Outlook.com</span></label>
      </div>
      <details class="hint mailtip"><summary data-t="mailLabelQ"></summary><p data-t="mailLabelA"></p></details>
      <p id="mail-msg" class="hint"></p>
    </section>
    <section class="card">
      <h2><i data-i="link"></i> <span data-t="optConnection"></span></h2>
      <p class="mode" id="mode"></p>
      <p class="hint"><span data-t="connLocalIntro"></span></p>
      <button id="open-shelf" class="mini"><i data-i="library"></i> <span data-t="openShelf"></span></button>
      <details id="srv" class="srv">
        <summary><i data-i="settings"></i> <span data-t="srvSummary"></span></summary>
        <p class="hint" data-t-html="srvWhat"></p>
        <label><span data-t="lblServer"></span><input id="server" placeholder="https://raf.example.com"></label>
        <p class="hint sub" data-t-html="srvUrlHelp"></p>
        <label><span data-t="lblToken"></span><input id="token" type="password" autocomplete="off"></label>
        <p class="hint sub" data-t-html="srvTokenHelp"></p>
        <button id="save" class="btn"><i data-i="check"></i> <span data-t="saveTest"></span></button>
        <p id="msg"></p>
        <p class="hint"><a href="https://github.com/selimyalinkilic/raf#run-it" target="_blank"><i data-i="external"></i> <span data-t="srvGuide"></span></a></p>
      </details>
    </section>
    <section class="card">
      <div class="h2row"><h2><i data-i="settings"></i> <span data-t="optFeatures"></span></h2>
        <span class="bulk"><button id="all-on" class="mini" data-t="optAllOn"></button><button id="all-off" class="mini" data-t="optAllOff"></button></span></div>
      <p class="hint"><span data-t="optFeaturesIntro"></span></p>
      <div id="features"></div>
    </section>
  </main>
  <script src="config.js"></script><script src="i18n.js"></script><script src="common.js"></script><script src="local.js"></script><script src="tg.js"></script>
  <script src="features.js"></script><script src="icons.js"></script><script src="options.js"></script>
</body></html>
